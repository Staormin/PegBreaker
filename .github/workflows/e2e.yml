# Suite Playwright complète, manuelle ou hebdomadaire (3 à 4 minutes, Chromium).
name: E2E Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results
            docs/qa/*-shots
