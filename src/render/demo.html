<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Pegbreaker — démo renderer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- Page de dev uniquement : `npm run dev` puis /src/render/demo.html -->
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module">
      import { mountRenderDemo } from './demo.ts';
      const n = Number(new URLSearchParams(location.search).get('balls')) || undefined;
      window.__stopRenderDemo = mountRenderDemo(document.getElementById('game'), { balls: n });
    </script>
  </body>
</html>
