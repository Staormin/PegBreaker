<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Pegbreaker — démo renderer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <!-- Page de dev uniquement : `npm run dev` puis /src/render/demo.html (?balls=30, ?gallery=1) -->
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module">
      import { mountRenderDemo, mountBallGallery } from './demo.ts';
      const q = new URLSearchParams(location.search);
      if (q.get('gallery') === '1') {
        // planche des 27 balles : page défilante
        for (const el of [document.documentElement, document.body]) { el.style.overflow = 'auto'; el.style.height = 'auto'; }
        const app = document.getElementById('app');
        app.style.position = 'static';
        window.__stopRenderDemo = mountBallGallery(document.getElementById('game'));
        window.__galleryReady = true;
      } else {
        const n = Number(q.get('balls')) || undefined;
        window.__stopRenderDemo = mountRenderDemo(document.getElementById('game'), { balls: n, debug: (api) => { window.__renderDemoApi = api; } });
      }
    </script>
  </body>
</html>
